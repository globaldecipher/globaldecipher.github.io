<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">The Global Decipher</title>
  <desc id="desc">The GT monogram in white on the deep red brand square.</desc>
  <!-- The full mark's ring and fort turn to mush below 32px, so the favicon
       carries just the GT monogram on the brand red. -->
  <rect width="64" height="64" rx="12" fill="#8d0f13"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="36" font-weight="700" fill="#faf9f5" letter-spacing="-1">GT</text>
</svg>
